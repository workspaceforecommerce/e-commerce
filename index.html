<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#166534" />
    
    <!-- SEO Primary Meta Tags -->
    <title>Healthy Monks - Organic Health & Ayurvedic Wellness Store</title>
    <meta name="title" content="Healthy Monks - Organic Health & Ayurvedic Wellness Store" />
    <meta name="description" content="Shop 100% natural, organic ayurvedic herbs, KSM-66 Ashwagandha, Himalayan Tulsi Green Tea, Amla Chyawanprash & Superfoods with fast shipping." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Healthy Monks - Pure Ayurvedic Wellness" />
    <meta property="og:description" content="100% natural immunity boosters, herbal teas, and traditional organic powders." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=1200&q=80" />

    <!-- PWA Manifest & Apple Touch -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Splash Screen Styles -->
    <style>
      #hm-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: radial-gradient(circle at center, #166534 0%, #14532d 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
        transform: scale(1);
        will-change: opacity, transform;
      }
      #hm-splash.hm-hidden {
        opacity: 0;
        transform: scale(1.05);
        visibility: hidden;
        pointer-events: none;
      }
      #hm-splash .hm-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hm-splash .hm-logo-glow {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 40px;
        background: rgba(255, 255, 255, 0.15);
        filter: blur(20px);
        animation: hm-glow 2.5s ease-in-out infinite alternate;
      }
      #hm-splash .hm-logo {
        position: relative;
        width: 110px;
        height: 110px;
        border-radius: 26px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.15);
        animation: hm-smooth-pop 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #hm-splash .hm-brand {
        color: #ffffff;
        font-family: 'Outfit', sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.5px;
        animation: hm-smooth-fade-up 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #hm-splash .hm-tagline {
        color: rgba(255, 255, 255, 0.75);
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        animation: hm-smooth-fade-up 0.8s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        margin-top: -14px;
      }
      #hm-splash .hm-dots {
        display: flex;
        gap: 8px;
        animation: hm-smooth-fade-up 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        margin-top: 10px;
      }
      #hm-splash .hm-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffffff;
        animation: hm-smooth-pulse 1.4s ease-in-out infinite;
      }
      #hm-splash .hm-dot:nth-child(2) { animation-delay: 0.2s; }
      #hm-splash .hm-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes hm-smooth-pop {
        0%   { opacity: 0; transform: scale(0.82) translateY(12px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes hm-smooth-fade-up {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes hm-glow {
        0%   { transform: scale(0.9); opacity: 0.12; }
        100% { transform: scale(1.15); opacity: 0.3; }
      }
      @keyframes hm-smooth-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50%      { opacity: 1;    transform: scale(1.25); }
      }
    </style>
  </head>
  <body>
    <!-- Splash / Loading Screen -->
    <div id="hm-splash" aria-hidden="true">
      <div class="hm-logo-container">
        <div class="hm-logo-glow"></div>
        <img src="/logo.png" alt="Healthy Monks" class="hm-logo" />
      </div>
      <span class="hm-brand">Healthy Monks</span>
      <span class="hm-tagline">Ayurvedic Wellness Store</span>
      <div class="hm-dots">
        <div class="hm-dot"></div>
        <div class="hm-dot"></div>
        <div class="hm-dot"></div>
      </div>
    </div>
    <script>
      if (sessionStorage.getItem('hm_splash_shown')) {
        var s = document.getElementById('hm-splash');
        if (s) s.parentNode.removeChild(s);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(() => {});
        });
      }

      // PWA Install prompt — store event for deferred prompt use
      // Calling preventDefault() suppresses the browser mini-infobar;
      // we store the event and call prompt() on user action instead.
      let _deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        _deferredInstallPrompt = e;
      });
      window._deferredInstallPrompt = null;
      Object.defineProperty(window, 'deferredInstallPrompt', {
        get() { return _deferredInstallPrompt; },
        set(v) { _deferredInstallPrompt = v; }
      });
    </script>
  </body>
</html>
